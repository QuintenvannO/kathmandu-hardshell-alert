name: Kathmandu Hardshell Price Alert

on:
  schedule:
    # Iedere 6 uur.
    # Amsterdam tijdzone wordt expliciet ingesteld.
    - cron: "17 */6 * * *"
      timezone: "Europe/Amsterdam"

  # Hiermee kun je hem handmatig starten.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-prices:

    runs-on: ubuntu-latest

    steps:

      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kathmandu controleren
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python hardshell_alert.py

      - name: Prijsdatabase opslaan
        run: |
          git config user.name "Kathmandu Price Bot"
          git config user.email "actions@github.com"

          git add state.json

          git diff --cached --quiet || \
            git commit -m "Update price state"

          git push
